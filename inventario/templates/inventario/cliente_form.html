{% extends 'inventario/base.html' %}

{% block title %}{{ titulo }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-5">
        <div class="card stat-card">
            <div class="card-header">
                <h5 class="mb-0"><i class="bi bi-person-plus-fill me-2"></i> {{ titulo }}</h5>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label fw-medium">Nombre del cliente</label>
                        {{ form.nombre }}
                        {% if form.nombre.errors %}
                            <div class="text-danger small mt-1">{{ form.nombre.errors.0 }}</div>
                        {% endif %}
                    </div>

                    <div class="d-flex gap-2">
                        <a href="{% url 'cliente_list' %}" class="btn btn-secondary flex-fill">
                            <i class="bi bi-arrow-left"></i> Cancelar
                        </a>
                        <button type="submit" class="btn btn-primary flex-fill">
                            <i class="bi bi-save"></i> Guardar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
