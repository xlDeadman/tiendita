{% extends 'inventario/base.html' %}

{% block title %}Agregar productos a {{ cliente.nombre }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">
                    <i class="bi bi-cart-plus"></i>
                    Agregar productos a {{ cliente.nombre }}
                </h5>
                <button type="button" class="btn btn-sm btn-success" id="btnAgregarFila">
                    <i class="bi bi-plus-circle"></i> Agregar otro
                </button>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}

                    <div id="productos-container">
                        <!-- Fila 1 -->
                        <div class="producto-fila fila-producto-box mb-3" data-index="0">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <strong class="label-fila-num">Producto #1</strong>
                                <button type="button" class="btn btn-sm btn-outline-danger btn-quitar-fila btn-quitar-oculto">
                                    <i class="bi bi-x-lg"></i>
                                </button>
                            </div>
                            <div class="row g-2">
                                <div class="col-12 col-md-5">
                                    <label class="form-label fw-bold label-fila-form">Producto</label>
                                    <select name="producto_0" class="form-select producto-select" data-idx="0" required>
                                        <option value="">— Selecciona —</option>
                                        {% for prod in productos %}
                                        <option value="{{ prod.pk }}" data-precio="{{ prod.precio }}">{{ prod.nombre }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                                <div class="col-6 col-md-2">
                                    <label class="form-label fw-bold label-fila-form">Cantidad</label>
                                    <input type="number" name="cantidad_0" class="form-control cantidad-input" data-idx="0" min="1" value="1" required>
                                </div>
                                <div class="col-6 col-md-3">
                                    <label class="form-label fw-bold label-fila-form">Precio unit.</label>
                                    <input type="number" name="precio_0" class="form-control precio-input" data-idx="0" min="0" step="0.50" required>
                                </div>
                                <div class="col-12 col-md-2">
                                    <label class="form-label fw-bold label-fila-form">Subtotal</label>
                                    <div class="subtotal-display" id="subtotal_0">$0.00</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <input type="hidden" name="total_filas" id="total_filas" value="1">

                    <!-- Total general -->
                    <div class="total-general-box mb-3">
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="total-general-label">Total general</span>
                            <span id="total-general" class="total-general-monto">$0.00</span>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{% url 'cliente_detail' cliente.pk %}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> Cancelar
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-cart-check"></i> Agregar todo
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
(function () {
  'use strict';

  let filaCount = 1;

  const productosData = [
    {% for prod in productos %}
    { id: {{ prod.pk }}, nombre: {{ prod.nombre|escapejs }}, precio: {{ prod.precio }} },
    {% endfor %}
  ];

  function construirOpciones() {
    let html = '<option value="">— Selecciona —</option>';
    productosData.forEach(p => {
      html += `<option value="${p.id}" data-precio="${p.precio}">${p.nombre}</option>`;
    });
    return html;
  }

  function construirFilaHtml(idx) {
    return `
    <div class="producto-fila fila-producto-box mb-3" data-index="${idx}">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <strong class="label-fila-num">Producto #${idx + 1}</strong>
            <button type="button" class="btn btn-sm btn-outline-danger btn-quitar-fila">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>
        <div class="row g-2">
            <div class="col-12 col-md-5">
                <label class="form-label fw-bold label-fila-form">Producto</label>
                <select name="producto_${idx}" class="form-select producto-select" data-idx="${idx}" required>
                    ${construirOpciones()}
                </select>
            </div>
            <div class="col-6 col-md-2">
                <label class="form-label fw-bold label-fila-form">Cantidad</label>
                <input type="number" name="cantidad_${idx}" class="form-control cantidad-input" data-idx="${idx}" min="1" value="1" required>
            </div>
            <div class="col-6 col-md-3">
                <label class="form-label fw-bold label-fila-form">Precio unit.</label>
                <input type="number" name="precio_${idx}" class="form-control precio-input" data-idx="${idx}" min="0" step="0.50" required>
            </div>
            <div class="col-12 col-md-2">
                <label class="form-label fw-bold label-fila-form">Subtotal</label>
                <div class="subtotal-display" id="subtotal_${idx}">$0.00</div>
            </div>
        </div>
    </div>`;
  }

  function agregarFila() {
    const idx = filaCount;
    const container = document.getElementById('productos-container');
    container.insertAdjacentHTML('beforeend', construirFilaHtml(idx));

    filaCount++;
    document.getElementById('total_filas').value = filaCount;
    actualizarBotonesQuitar();
    attachEventosFila(container.lastElementChild);
  }

  function quitarFila(btn) {
    btn.closest('.producto-fila').remove();
    actualizarTotalGeneral();
    actualizarBotonesQuitar();
  }

  function actualizarBotonesQuitar() {
    const filas = document.querySelectorAll('.producto-fila');
    filas.forEach(f => {
      const btn = f.querySelector('.btn-quitar-fila');
      if (btn) btn.classList.toggle('btn-quitar-oculto', filas.length <= 1);
    });
  }

  function cargarPrecio(select) {
    const idx = select.dataset.idx;
    const option = select.options[select.selectedIndex];
    const precio = option.dataset.precio || '';
    const precioInput = document.querySelector(`input[name="precio_${idx}"]`);
    if (precioInput) precioInput.value = precio;
    calcularSubtotal(idx);
  }

  function calcularSubtotal(idx) {
    const cant = parseFloat(document.querySelector(`input[name="cantidad_${idx}"]`)?.value) || 0;
    const precio = parseFloat(document.querySelector(`input[name="precio_${idx}"]`)?.value) || 0;
    const sub = cant * precio;
    const el = document.getElementById(`subtotal_${idx}`);
    if (el) el.textContent = '$' + sub.toFixed(2);
    actualizarTotalGeneral();
  }

  function actualizarTotalGeneral() {
    let total = 0;
    document.querySelectorAll('.subtotal-display').forEach(el => {
      total += parseFloat(el.textContent.replace('$', '')) || 0;
    });
    document.getElementById('total-general').textContent = '$' + total.toFixed(2);
  }

  function attachEventosFila(fila) {
    fila.querySelector('.producto-select')?.addEventListener('change', function () {
      cargarPrecio(this);
    });
    fila.querySelector('.cantidad-input')?.addEventListener('input', function () {
      calcularSubtotal(this.dataset.idx);
    });
    fila.querySelector('.precio-input')?.addEventListener('input', function () {
      calcularSubtotal(this.dataset.idx);
    });
    fila.querySelector('.btn-quitar-fila')?.addEventListener('click', function () {
      quitarFila(this);
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.getElementById('btnAgregarFila')?.addEventListener('click', agregarFila);
    document.querySelectorAll('.producto-fila').forEach(attachEventosFila);
  });
})();
</script>
{% endblock %}
